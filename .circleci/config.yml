version: 2.1

jobs:
  salesforce-ci:
    docker:
      - image: cimg/node:22.15.0
    steps:
      - checkout

      - run:
          name: Install Salesforce CLI
          command: |
            sudo npm install --global @salesforce/cli
            sf version

      - run:
          name: Authenticate with Salesforce
          command: |
            echo "$SF_JWT_KEY_B64" | base64 --decode > /tmp/server.key
            chmod 600 /tmp/server.key
            sf org login jwt \
              --client-id "$SF_CLIENT_ID" \
              --jwt-key-file /tmp/server.key \
              --username "$SF_USERNAME" \
              --instance-url "$SF_LOGIN_URL" \
              --alias ERestaurantDev

      - run:
          name: Validate Salesforce Project Configuration
          command: |
            test -f sfdx-project.json
            node -e "JSON.parse(require('fs').readFileSync('sfdx-project.json', 'utf8')); console.log('Salesforce project configuration is valid JSON')"

      - run:
          name: Check Salesforce Source Directory
          command: |
            test -d force-app/main/default
            echo "Salesforce source directory exists"

workflows:
  salesforce-pipeline:
    jobs:
      - salesforce-ci